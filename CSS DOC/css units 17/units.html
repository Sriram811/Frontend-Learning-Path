<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #demo1{
            height: 100px;
            width: 100px;
            border: 3px solid black;
        }
        #demo2{
            height: 150px;
            width: 30%;
            border: 3px solid black;
        }
        #demo3{
            height: 10em;
            width: 60em;
            border: 3px solid black;
        }
        #demo4{
            height: 10rem;
            width: 10rem;
            border: 3px solid black;
        }
        #demo5{
            height: 20vh;
            width: 40vw;
            border: 3px solid black;
        }

    </style>
</head>
<body>
    <div id="demo1">px</div>
    <div id="demo2">%</div>
    <div id="demo3">em</div>
    <div id="demo4">rem</div>
    <div id="demo5">vh and vw</div>
</body>
</html>

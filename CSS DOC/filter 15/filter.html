<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
            height: 300px;
            border: 3px solid black;
            filter: blur(1px);
            filter: grayscale(100%);
            filter: invert(25%);
            filter: brightness(15);
            filter: contrast(20%);
            filter: sepia(100%);
            filter: saturate(50%);
            filter: hue-rotate(190deg);
            filter: drop-shadow(blur);
            filter: blur(1px) brightness(1.2) sepia(5%);
        }
    </style>
</head>
<body>
    <img src="headset.jpg" alt="">
    <img src="macnew.jpg" alt="">
</body>
</html>

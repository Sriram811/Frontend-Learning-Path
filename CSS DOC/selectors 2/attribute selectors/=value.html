<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        [title="para"] {
            color: aquamarine;
            background: rgb(162, 39, 162);
        }
    </style>
</head>
<body>
    <!-- used to select elements with exact same value and name and doesn't allow any spaces -->
    <p title="para">raja</p>
    <p title="para ">raja</p>
    <p id="para">raja</p>
    <p title="para">raja</p>
    <p class="para">raja</p>
</body>
</html>

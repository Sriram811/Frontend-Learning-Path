<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Selects all <p> elements with a title attribute equal to "para" */
        [title*="para"] {
            color: blue;
            background: rgb(162, 39, 162);
        }
    </style>
</head>
<body>
    <!-- used to element based on the attribute name -->
    <p title="para">raja</p>
    <p title="para">chintu</p>
    <p title="para">mintu</p>
    <p id="para">buji</p>
    <p title="graphparagraph">sai</p>
</body>
</html>

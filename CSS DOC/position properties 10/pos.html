<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #stati{
            position: static;
            left: 50px;
        }
        #ab{
            position: absolute;
            left: 120px;
        }
        #rel{
            position: relative;
            left: 200px;
        }
        #fix{
            position: fixed;
            left: 250px;
        }
        #stick{
            position: sticky;
            left: 150px;
        }
        #box1{
            width: 100px;
            height: 100px;
            border-radius: 5px;
            /* border: 5px solid green; */
            box-shadow: 5px 5px 20px 5px black;
            /* margin-left: 600px; */
            position: absolute;
            left: 600px;
            bottom: 50px;
        }

        #box2{
            width: 100px;
            height: 100px;
            border-radius: 5px;
            /* border: 5px solid green; */
            box-shadow: 5px 5px 20px 5px rgb(1, 221, 255);
            /* margin-left: 600px; */
            position: relative;
            left: 600px;
            bottom: 20px;
        }

        #box3{
            width: 1500px;
            height: 100px;
            border-radius: 5px;
            /* border: 5px solid green; */
            box-shadow: 5px 5px 20px 5px rgb(18, 6, 96);
            /* margin-left: 600px; */
            position: fixed;
            top: 10px;
            bottom: 250px;
        }

        #box4{
            width: 100px;
            height: 100px;
            border-radius: 5px;
            /* border: 5px solid green; */
            box-shadow: 5px 5px 20px 5px rgb(119, 5, 5);
            /* margin-left: 600px; */
            position: sticky;
            left: 600px;
            /* bottom: 600px; */
        }
    </style>
</head>
<body>
    
     <br><br><br><br><br><br>
     <div id="box1">absolute</div>

     <br><br><br>
     <div id="box2">relative</div>

     <br><br><br>
     <div id="box3">fixed</div>

     <br><br><br>
     <div id="box4">sticky</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // 1) document.head 
        // used to give the entire head and elements present inside the head separately from the entire structure of HTML
        console.log(document.head)

        // 2) document.body
        // used to give the entire body and elements present inside the body tag separately
        console.log(document.body)

        // 3) document.title
        // used to provide the title of the element
        console.log(document.title)
    </script>
</body>
</html>

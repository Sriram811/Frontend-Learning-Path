<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        // Date can be created using the Date() along with the new Keyword...
        let a = new Date();
        console.log(a);
        console.log(a.getFullYear());
        console.log(a.getMonth());
        console.log(a.getDate());
        console.log(a.getDay());
        console.log(a.getHours());
        console.log(a.getMinutes());
        console.log(a.getSeconds());
        console.log(a.getMilliseconds());

        // Date can be created using the Date() along with the new Keyword...
        let b= new Date()
        b.setDate(15);
        b.setMonth(5);
        b.setFullYear(2030)
        b.setHours(10,20,20);
        // b.setHours(Hour,Minute,Second,Millisecond)
        b.setMinutes(30);
        b.setSeconds(30);
        b.setMilliseconds(500);
        console.log(b);
    </script>
</body>
</html>

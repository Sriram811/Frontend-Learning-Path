<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br> <br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br> <br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
        <br> <br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
        <br> <br>

        <label for="message">Message:</label>
        <input type="text" id="message" name="message" placeholder="Enter your message">
        <br> <br>

        <label for="subject">Subject:</label>
        <input type="text" id="subject" name="subject" placeholder="Enter the subject">
        <br> <br>

        <label for="resume">Select your Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        <br><br>
        
        <label for="gender">Select your Gender</label>
        <br><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <br><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>
        
        <label for="address">Address:</label>
        <br>
        <textarea rows="5" cols="60" name="Address" id="address" placeholder="Enter your address"></textarea>
        <br> <br>

        <label for="domain">Domain:</label>
        <select name="domain" id="domain" required>
            <option value="" hidden>Select your domain</option>
            <option value="web">Web Development</option>
            <option value="app">App Development</option>
            <option value="design">Design</option>
            <option value="marketing">Marketing</option>
            <option value="other">Other</option>
        </select>
        <br><br><br>
        <label for="interests">Select your languages:</label>

        <input type="checkbox" id="english" name="interests" value="english">
        <label for="english">English</label>
        <input type="checkbox" id="spanish" name="interests" value="spanish">
        <label for="spanish">Spanish</label>
        <input type="checkbox" id="french" name="interests" value="french">
        <label for="french">French</label>
        <input type="checkbox" id="german" name="interests" value="german">
        <label for="german">German</label>
        
        
        <br> <br>

        <button type="submit" name="Submit">Submit</button>
    </fieldset>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required minlength="10" maxlength="100" readonly>
            <br><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
            <br><br><br>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="18" max="75">
                
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
            <br><br><br>

            <label for="languages">Select Languages:</label>
            <input type="checkbox" id="languages" name="languages">
            <label for="languages">English</label>
            <input type="checkbox" id="languages" name="languages">
            <label for="languages">Spanish</label>
            <input type="checkbox" id="languages" name="languages">
            <label for="languages">French</label>
            <label for="bio">Biography:</label>
                
            <br><br><br>
            <label for="bio">Biography:</label>
            <br><br>
            <textarea name="bio" id="bio" rows="4" cols="50"></textarea>

            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
</html>
